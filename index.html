<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Espetinho & Cia</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <link rel="stylesheet" href="style.css">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="img/logo.jpg">
    <meta name="theme-color" id="meta-theme-color" content="#e63946">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Espetinho & Cia">
    <link rel="apple-touch-icon" href="img/logo.jpg">
    
    <style>
        /* Sombra suave para dar profundidade na logo igual ao app */
        .logo-depth { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        
        /* Animação suave de entrada */
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Melhoria no toque para mobile */
        button:active { transform: scale(0.96); }
    </style>

    <script>
        tailwind.config = { darkMode: 'class' };
        if (localStorage.getItem('temaSistema') === 'dark' || (!('temaSistema' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-[#e63946] dark:bg-slate-950 flex items-center justify-center min-h-screen p-6 font-sans transition-colors duration-300">

    <div class="bg-white dark:bg-slate-900 w-full max-w-[340px] rounded-[2.5rem] p-8 pt-12 shadow-2xl flex flex-col items-center relative animate-fade-in-up transition-colors duration-300">

        <div class="absolute -top-12 bg-white dark:bg-slate-900 p-2 rounded-full shadow-lg">
            <img src="img/logo.jpg" alt="Logo Espetinho & Cia" class="w-24 h-24 rounded-full border-4 border-slate-50 dark:border-slate-800 object-cover logo-depth">
        </div>

        <h1 class="mt-10 text-[#e63946] text-2xl font-black italic tracking-tighter mb-1 uppercase drop-shadow-sm">ESPETINHO & CIA</h1>
        <p class="text-slate-300 dark:text-slate-500 text-[9px] font-black uppercase tracking-[0.2em] mb-8">Sistema de Gestão</p>

        <!-- Convertido para tag form para suporte nativo de navegadores e gerenciadores de senha -->
        <form class="w-full space-y-4" onsubmit="event.preventDefault(); fazerLogin();">
            <div>
                <label for="user" class="block text-[9px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2 ml-3 italic flex items-center gap-1">
                    <i data-lucide="user" class="w-3 h-3"></i> Usuário
                </label>
                <input type="text" id="user" autocomplete="username" placeholder="SEU USUÁRIO"
                    class="w-full bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl p-4 text-xs font-bold text-slate-700 dark:text-white outline-none focus:border-[#e63946] focus:ring-1 focus:ring-[#e63946]/20 transition-all uppercase font-sans placeholder:text-slate-300 dark:placeholder:text-slate-600">
            </div>

            <div>
                <label for="pass" class="block text-[9px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2 ml-3 italic flex items-center gap-1">
                    <i data-lucide="lock" class="w-3 h-3"></i> Senha
                </label>
                <div class="relative">
                    <input type="password" id="pass" autocomplete="current-password" placeholder="••••••••"
                        class="w-full bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl p-4 pr-12 text-xs font-bold text-slate-700 dark:text-white outline-none focus:border-[#e63946] focus:ring-1 focus:ring-[#e63946]/20 transition-all font-sans placeholder:text-slate-300 dark:placeholder:text-slate-600">

                    <button type="button" aria-label="Mostrar Senha" onclick="toggleVerSenha('pass')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 p-1 hover:text-[#e63946] transition-colors">
                        <span id="icon-pass-login" class="text-sm transition-all"><i data-lucide="eye" class="w-4 h-4"></i></span>
                    </button>
                </div>
            </div>

            <!-- Checkbox Lembrar-me -->
            <div class="flex items-center justify-between pt-1 pb-2">
                <label for="lembrar-me" class="flex items-center gap-2 cursor-pointer group">
                    <div class="relative flex items-center justify-center">
                        <input type="checkbox" id="lembrar-me" 
                            class="peer appearance-none w-4 h-4 border-2 border-slate-200 dark:border-slate-600 rounded bg-slate-50 dark:bg-slate-800 checked:bg-[#e63946] checked:border-[#e63946] transition-all cursor-pointer">
                        <i data-lucide="check" class="w-3 h-3 text-white absolute opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none"></i>
                    </div>
                    <span class="text-[9px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest group-hover:text-slate-600 dark:group-hover:text-slate-300 transition-colors">
                        Lembrar meu usuário
                    </span>
                </label>
            </div>

            <!-- Botão com type="submit" para permitir login apertando Enter -->
            <button type="submit" id="btn-entrar"
                class="w-full bg-[#e63946] text-white py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-lg shadow-red-200 dark:shadow-red-950/50 transition-all mt-4 border-2 border-white dark:border-slate-800 hover:brightness-110 flex items-center justify-center gap-2">
                ENTRAR NO SISTEMA <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <p class="text-slate-300 dark:text-slate-600 text-[8px] mt-10 font-black uppercase tracking-widest opacity-60">
            Desenvolvido por Cleicimar Vaz
        </p>
    </div>

    <!-- Scripts com Defer para não bloquear a renderização -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="componentes/config.js" defer></script>
    <script src="componentes/database.js" defer></script>
    <script src="componentes/utils.js" defer></script>
    <script src="componentes/login.js" defer></script>
    <script src="componentes/audit.js" defer></script>

    <script>
        // Sincroniza a cor do tema com a configuração global
        if (typeof PRIMARY_COLOR !== 'undefined') {
            document.getElementById('meta-theme-color').setAttribute('content', PRIMARY_COLOR);
        }

        // Inicialização dos ícones do Lucide
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
          
</body>
</html>
