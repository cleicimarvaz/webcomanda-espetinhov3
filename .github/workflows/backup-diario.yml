name: Backup Diário do Sistema

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar backup automático
        run: node scripts/backup-diario.js
