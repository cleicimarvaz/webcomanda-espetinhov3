services:
  postgres:
    image: postgres:18.6
    container_name: webcomanda-postgres-v3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - webcomanda_postgres_v3_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Ferramenta de migrations SQL. Só executa quando chamada explicitamente
  # com --profile migrations; não inicia junto com o PostgreSQL normalmente.
  dbmate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    profiles: ["migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_STRICT: "true"
      DBMATE_MIGRATION_LOCK: "true"
    volumes:
      - ../../database/migrations:/migrations

volumes:
  webcomanda_postgres_v3_data:
